name: CI/CD

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost
        run: python manage.py test --verbosity=2

      - name: Check for missing migrations
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files (production mode)
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'False'
          ALLOWED_HOSTS: example.com
        run: python manage.py collectstatic --noinput

      - name: Django deployment check
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'False'
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --settings=hirely.settings

  deploy:
    name: Deploy (Render)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null

      - name: Deploy hook not configured
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deploy."
