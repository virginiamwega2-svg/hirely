services:
  - type: web
    name: hirely
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn hirely.wsgi --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: hirely.onrender.com
      # DATABASE_URL is now set manually in the Render dashboard
      # (points to Neon — see neon.tech project "hirely").
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: PYTHON_VERSION
        value: "3.12.0"
