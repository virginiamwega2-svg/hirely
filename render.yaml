services:
  - type: web
    name: hirely
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn hirely.wsgi --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: hirely.onrender.com
      # DATABASE_URL is now set manually in the Render dashboard
      # (points to Neon — see neon.tech project "hirely").
      - key: DATABASE_URL
        sync: false
      # Real email delivery via Resend SMTP. Set EMAIL_HOST_PASSWORD
      # to your Resend API key in the Render dashboard.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Hirely <onboarding@resend.dev>
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Powers the "Talk to Hirely" chat agent + AI drafted notes + weekly digest.
      # Set the value manually in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false

  # Weekly AI-curated digest — Mondays 09:00 UTC.
  - type: cron
    name: hirely-weekly-digest
    runtime: python
    schedule: "0 9 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_job_alerts
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: hirely.onrender.com
      - key: DATABASE_URL
        sync: false
      # Real email delivery via Resend SMTP. Set EMAIL_HOST_PASSWORD
      # to your Resend API key in the Render dashboard.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Hirely <onboarding@resend.dev>
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ANTHROPIC_API_KEY
        sync: false

  # Weekly stale-job nudge — Sundays 18:00 UTC.
  - type: cron
    name: hirely-stale-job-nudge
    runtime: python
    schedule: "0 18 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py nudge_stale_jobs
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: hirely.onrender.com
      - key: DATABASE_URL
        sync: false
      # Real email delivery via Resend SMTP. Set EMAIL_HOST_PASSWORD
      # to your Resend API key in the Render dashboard.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Hirely <onboarding@resend.dev>
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ANTHROPIC_API_KEY
        sync: false
